spring.application.name=micompu

spring.jackson.deserialization.fail-on-null-for-primitives=false

# Conexión real de la API (JDBC nativo)
db.url=${DB_URL:jdbc:mysql://localhost:3306/mi_compu_unab?sslMode=DISABLED&allowPublicKeyRetrieval=true}
db.usuario=${DB_USER}
db.clave=${DB_PASSWORD}

# Espejo de db.* para el pool HikariCP que exige el starter-jdbc.
spring.datasource.url=${db.url}
spring.datasource.username=${db.usuario}
spring.datasource.password=${db.clave}
